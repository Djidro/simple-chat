<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SimpleChat — Modern Messaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div id="splash-screen" class="splash-overlay">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/></svg>
    </div>
    <h1>SimpleChat</h1>
  </div>

  <!-- AUTH SCREEN -->
  <section id="auth-screen" class="screen hidden">
    <div class="auth-wrapper">
      <div class="auth-card glass-strong">
        <div class="auth-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/></svg>
          </div>
          <h1>SimpleChat</h1>
          <p class="muted">Fast, secure, beautiful messaging</p>
        </div>
        <div class="auth-fields">
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="auth-name" type="text" placeholder="Full name" autocomplete="name" />
          </div>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input id="auth-email" type="email" placeholder="Email address" autocomplete="email" />
          </div>
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
          </div>
          <div class="auth-buttons">
            <button id="btn-login" class="btn-primary">
              <span>Sign In</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
            <button id="btn-signup" class="btn-secondary">Create Account</button>
          </div>
          <p id="auth-error" class="error"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- CHAT LIST SCREEN -->
  <section id="list-screen" class="screen hidden">
    <header class="topbar glass">
      <button id="btn-menu" class="icon-btn" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <div class="topbar-left">
        <h2>Messages</h2>
        <small id="me-label" class="muted clickable">My Profile</small>
      </div>
      <div class="topbar-actions">
        <button id="btn-search-toggle" class="icon-btn" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button id="btn-new-chat" class="icon-btn" title="New Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
        <button id="btn-logout" class="icon-btn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        </button>
      </div>
    </header>
    <div class="search-bar" id="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Search conversations..." />
    </div>
    <div class="list-container">
      <ul id="conversation-list" class="list"></ul>
    </div>
    <div class="bottom-nav glass">
      <button class="nav-item active" data-screen="chats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chats</span>
      </button>
      <button class="nav-item" id="btn-users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>People</span>
      </button>
      <button class="nav-item" id="btn-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </section>

  <!-- CHAT ROOM SCREEN -->
  <section id="chat-screen" class="screen hidden">
    <header class="topbar glass">
      <button id="btn-back" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="peer-info clickable" id="peer-info-click">
        <div class="peer-avatar" id="peer-avatar-small">
          <span class="avatar-letter">?</span>
          <span class="online-dot-small" id="peer-dot-small"></span>
        </div>
        <div class="peer-details">
          <strong id="peer-name">User</strong>
          <small id="peer-status" class="muted">offline</small>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-call" class="icon-btn" title="Call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button id="btn-chat-menu" class="icon-btn" title="More">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </header>
    <div id="messages" class="messages">
      <div class="messages-date"><span>Today</span></div>
    </div>
    <form id="send-form" class="composer glass">
      <button type="button" id="btn-attach" class="icon-btn attach-btn" title="Attach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="file-input" accept="image/*,video/*,audio/*" hidden />
      <div class="input-wrapper">
        <input id="message-input" type="text" placeholder="Message" autocomplete="off" />
      </div>
      <button type="button" id="btn-record" class="icon-btn record-btn" title="Voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </button>
      <button type="submit" id="btn-send" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </section>

  <!-- NEW CHAT MODAL -->
  <div id="new-chat-modal" class="modal-overlay hidden">
    <div class="modal-card glass-strong">
      <div class="modal-header">
        <h3>New Conversation</h3>
        <button id="btn-cancel-chat" class="icon-btn modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input id="new-chat-email" type="email" placeholder="Enter user email..." />
        </div>
        <p id="new-chat-error" class="error"></p>
      </div>
      <div class="modal-footer">
        <button id="btn-start-chat" class="btn-primary">Start Chat</button>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card glass-strong profile-card">
      <div class="modal-header">
        <h3>Profile</h3>
        <button id="btn-profile-close" class="icon-btn modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="profile-avatar" class="avatar-large clickable">
          <span class="avatar-letter-large">?</span>
          <div class="avatar-upload-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
        </div>
        <input type="file" id="avatar-upload" accept="image/*" hidden />
        <h3 id="profile-name">Name</h3>
        <p id="profile-email" class="muted"></p>
        <span id="profile-status" class="status-badge"></span>
        <button id="btn-delete-avatar" class="btn-text danger" style="display:none;">Remove Photo</button>
      </div>
      <div class="modal-footer">
        <button id="btn-profile-message" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Message
        </button>
      </div>
    </div>
  </div>

  <!-- USERS MODAL -->
  <div id="users-modal" class="modal-overlay hidden">
    <div class="modal-card glass-strong">
      <div class="modal-header">
        <h3>People</h3>
        <button id="btn-users-close" class="icon-btn modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <ul id="users-list" class="list"></ul>
      </div>
    </div>
  </div>

  <!-- IMAGE ZOOM MODAL -->
  <div id="image-zoom-modal" class="modal-overlay hidden zoom-overlay">
    <button id="btn-close-zoom" class="zoom-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <img id="zoom-image" src="" alt="Preview" />
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
